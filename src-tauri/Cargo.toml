[package]
name = "adb-phone-sync"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adb_phone_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tokio = { version = "1", features = ["time", "rt"] }
# Real free-disk-space lookup for the Run screen's preflight space check
# (`space::free_space_bytes`) -- pure Rust, no libc, cross-platform
# `available_space(path)`. Suggested as an example crate for this exact
# purpose in the original design doc.
fs4 = "1.1.0"

[dev-dependencies]
# Adds #[tokio::test]/multi-thread runtime support for
# `space::tests::free_space_bytes_reports_a_plausible_value_for_a_real_path`,
# which exercises `space::free_space_bytes` (a real `fs4` syscall) end to
# end. Test-only: the shipped binary only ever needs the `time`/`rt`
# features declared above.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

